name: Build Electron App

on:
  push:
    branches:
      - 'devin/*electron*'
      - 'devin/*speechify*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows portable exe
        working-directory: electron
        run: npx electron-builder --win portable --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        working-directory: electron/dist
        run: dir

      - name: Upload portable exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormFlowDesktopPro-Windows
          path: electron/dist/*.exe
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-speechify
          name: FormFlow Desktop Pro v2.1.0 (VAPI + Speechify)
          body: |
            ## FormFlow Desktop Pro v2.1.0 — VAPI + Speechify Edition

            **Chromium is embedded** — no separate browser download needed.

            ### Workflows Included
            - **VAPI AI Registration** — Turnstile token extraction + Supabase API + promo code (VAPIHERVOICE)
            - **Speechify Premium** — Onboarding + Stripe CDP payment ($0.00 promo) + reCAPTCHA audio auto-solver

            ### Features
            - 25+ stealth Chromium flags applied at process level
            - Anti-detection JS injection (navigator.webdriver removed, plugins spoofed, etc.)
            - VPN auto-connect & auto-rotate (NordVPN, Surfshark, ExpressVPN)
            - Bulk registration mode — generate N accounts with random emails
            - Stripe cross-origin iframe filling via CDP WebSocket
            - reCAPTCHA v2 audio challenge auto-solver (MP3 → speech-to-text)
            - Mailgun email verification relay
            - Structured debug logger with live event stream

            ### How to use
            1. Download `FormFlowDesktopPro.exe` below
            2. Run it — no installation needed (portable)
            3. Click **Load Speechify Premium** or **Load VAPI AI Registration**
            4. Fill in your Mailgun API key
            5. Enable Bulk Mode, set count to 5, click **Start Workflow**
          draft: false
          prerelease: false
          files: electron/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
